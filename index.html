<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PulseHub Key</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#00aaff;
    --cyan:#00eaff;
    --deep:#0066ff;
    --black:#02060a;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% -15%,rgba(0,190,255,.20),transparent 32%),
        radial-gradient(circle at 100% 100%,rgba(0,80,255,.16),transparent 35%),
        #02060a;

    color:white;
    font-family:Inter,sans-serif;
}

/* =========================
   MOVING GRID
========================= */

.grid{
    position:fixed;
    inset:-100px;
    pointer-events:none;
    opacity:.18;

    background-image:
        linear-gradient(rgba(0,190,255,.07) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,190,255,.07) 1px,transparent 1px);

    background-size:55px 55px;

    transform:perspective(500px) rotateX(55deg) scale(1.5);

    animation:gridMove 14s linear infinite;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:0 110px;
    }
}

/* =========================
   LIGHT ORBS
========================= */

.orb{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    filter:blur(100px);
}

.orb1{
    width:400px;
    height:400px;
    background:rgba(0,150,255,.16);
    left:-180px;
    top:-180px;
    animation:orb1 8s ease-in-out infinite alternate;
}

.orb2{
    width:360px;
    height:360px;
    background:rgba(0,230,255,.13);
    right:-170px;
    bottom:-170px;
    animation:orb2 10s ease-in-out infinite alternate;
}

@keyframes orb1{
    to{
        transform:translate(150px,100px) scale(1.2);
    }
}

@keyframes orb2{
    to{
        transform:translate(-130px,-100px) scale(1.25);
    }
}

/* =========================
   PARTICLES
========================= */

.particle{
    position:fixed;
    bottom:-20px;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#00d9ff;

    box-shadow:
        0 0 8px #00bfff,
        0 0 18px rgba(0,190,255,.7);

    animation:particleUp linear infinite;

    pointer-events:none;
}

@keyframes particleUp{

    0%{
        transform:translateY(0) scale(.3);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    80%{
        opacity:.7;
    }

    100%{
        transform:translateY(-110vh) scale(1.5);
        opacity:0;
    }
}

/* =========================
   CARD
========================= */

.card{
    position:relative;

    width:min(94%,520px);

    padding:46px 34px 30px;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(8,21,32,.88),
            rgba(2,7,12,.91)
        );

    border:1px solid rgba(0,200,255,.18);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    box-shadow:
        0 40px 120px rgba(0,0,0,.7),
        0 0 80px rgba(0,140,255,.08),
        inset 0 1px rgba(255,255,255,.08);

    text-align:center;

    animation:cardIn 1s cubic-bezier(.16,1,.3,1);

    z-index:5;
}

.card::before{
    content:"";

    position:absolute;
    inset:-1px;

    border-radius:33px;

    padding:1px;

    background:
        linear-gradient(
            120deg,
            transparent 20%,
            rgba(0,230,255,.55),
            transparent 45%,
            transparent 70%,
            rgba(0,100,255,.45)
        );

    background-size:300% 300%;

    animation:borderFlow 5s linear infinite;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite:exclude;

    pointer-events:none;
}

@keyframes borderFlow{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.92);
        filter:blur(12px);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

/* =========================
   PREMIUM P LOGO
========================= */

.logo-area{
    position:relative;

    width:112px;
    height:112px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* Outer rotating ring */

.logo-ring{
    position:absolute;
    inset:-6px;

    border-radius:34px;

    border:1px solid rgba(0,210,255,.25);

    border-top-color:#00eaff;
    border-right-color:#008cff;

    box-shadow:
        0 0 25px rgba(0,180,255,.22);

    animation:ringRotate 7s linear infinite;
}

.logo-ring::before,
.logo-ring::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 12px #00eaff,
        0 0 25px #00aaff;
}

.logo-ring::before{
    top:9px;
    left:24px;
}

.logo-ring::after{
    right:12px;
    bottom:18px;
}

@keyframes ringRotate{
    to{
        transform:rotate(360deg);
    }
}

/* Main logo */

.logo{
    position:relative;

    width:100px;
    height:100px;

    border-radius:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(0,225,255,.18),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            #0a2232,
            #02070c
        );

    border:1px solid rgba(0,210,255,.38);

    box-shadow:
        0 0 35px rgba(0,160,255,.28),
        inset 0 0 35px rgba(0,150,255,.10);

    animation:logoFloat 4s ease-in-out infinite;
}

.logo::before{
    content:"";

    position:absolute;
    inset:6px;

    border-radius:25px;

    border:1px solid rgba(255,255,255,.06);
}

.logo::after{
    content:"";

    position:absolute;

    width:50px;
    height:50px;

    background:#00cfff;

    filter:blur(35px);

    opacity:.13;
}

/* P itself */

.p{
    position:relative;
    z-index:3;

    font-family:"Space Grotesk",sans-serif;

    font-size:64px;
    font-weight:800;

    line-height:1;

    background:
        linear-gradient(
            145deg,
            #ffffff 5%,
            #baf6ff 30%,
            #00d9ff 60%,
            #0077ff 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 20px rgba(0,205,255,.35);

    animation:pGlow 3s ease-in-out infinite alternate;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-7px) rotate(1deg);
    }
}

@keyframes pGlow{
    from{
        filter:drop-shadow(0 0 5px rgba(0,220,255,.2));
    }

    to{
        filter:drop-shadow(0 0 16px rgba(0,220,255,.55));
    }
}

/* =========================
   TITLE
========================= */

.title{
    font-family:"Space Grotesk",sans-serif;

    font-size:40px;
    font-weight:700;

    letter-spacing:-1.8px;

    margin-bottom:9px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c8f7ff,
            #00cfff,
            #ffffff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleMove 5s linear infinite;
}

@keyframes titleMove{
    to{
        background-position:250% center;
    }
}

.subtitle{
    color:#71869a;

    font-size:13px;

    margin-bottom:31px;
}

/* =========================
   KEY BOX
========================= */

.key-box{
    position:relative;

    width:100%;

    height:65px;

    display:flex;
    align-items:center;

    padding:0 18px;

    border-radius:18px;

    background:
        linear-gradient(
            100deg,
            rgba(0,160,255,.07),
            rgba(255,255,255,.025),
            rgba(0,160,255,.07)
        );

    border:1px solid rgba(0,190,255,.14);

    overflow:hidden;

    box-shadow:
        inset 0 1px rgba(255,255,255,.04);
}

/* moving shine */

.key-box::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:65%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,220,255,.13),
            transparent
        );

    transform:skewX(-20deg);

    animation:keyShine 4s ease-in-out infinite;
}

@keyframes keyShine{

    0%,35%{
        left:-120%;
    }

    70%,100%{
        left:140%;
    }
}

.key-label{
    position:absolute;

    top:7px;
    left:18px;

    color:#50677a;

    font-size:8px;
    font-weight:800;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

/* KEY STAYS ON ONE LINE */

.key{
    display:block;

    width:100%;

    padding-top:8px;

    color:#dffaff;

    font-family:"Space Grotesk",sans-serif;

    font-size:13px;

    font-weight:600;

    white-space:nowrap;

    overflow-x:auto;

    overflow-y:hidden;

    scrollbar-width:none;

    text-align:left;
}

.key::-webkit-scrollbar{
    display:none;
}

/* =========================
   COPY BUTTON
========================= */

.copy-btn{
    position:relative;

    width:100%;
    height:56px;

    margin-top:15px;

    border:none;
    outline:none;

    border-radius:17px;

    color:white;

    font-size:14px;
    font-weight:800;

    cursor:pointer;

    background:
        linear-gradient(
            100deg,
            #006eff,
            #00cfff,
            #0077ff,
            #006eff
        );

    background-size:300% 100%;

    box-shadow:
        0 12px 35px rgba(0,120,255,.24),
        inset 0 1px rgba(255,255,255,.3);

    overflow:hidden;

    animation:buttonGradient 5s linear infinite;

    transition:.25s ease;
}

@keyframes buttonGradient{
    to{
        background-position:300% 0;
    }
}

.copy-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-100px;

    width:65px;
    height:100%;

    background:rgba(255,255,255,.25);

    transform:skewX(-20deg);

    animation:buttonShine 3.2s infinite;
}

@keyframes buttonShine{

    0%,30%{
        left:-100px;
    }

    65%,100%{
        left:120%;
    }
}

.copy-btn:hover{
    transform:translateY(-4px);

    box-shadow:
        0 18px 48px rgba(0,150,255,.36),
        0 0 30px rgba(0,190,255,.15);
}

.copy-btn:active{
    transform:scale(.97);
}

/* =========================
   STATUS
========================= */

.status{
    height:18px;

    margin-top:13px;

    color:#5d7285;

    font-size:11px;
    font-weight:600;

    transition:.3s;
}

.footer{
    margin-top:18px;

    color:#3e5263;

    font-size:9px;

    letter-spacing:1px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{
        padding:12px;
    }

    .card{
        width:100%;
        padding:39px 18px 27px;
        border-radius:27px;
    }

    .logo-area{
        width:94px;
        height:94px;
    }

    .logo{
        width:84px;
        height:84px;
        border-radius:26px;
    }

    .p{
        font-size:54px;
    }

    .title{
        font-size:32px;
    }

    .key-box{
        height:64px;
        padding:0 15px;
    }

    .key{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>


<!-- PARTICLES -->

<div class="particle" style="left:4%;animation-duration:10s;"></div>
<div class="particle" style="left:12%;animation-duration:14s;animation-delay:2s;"></div>
<div class="particle" style="left:21%;animation-duration:11s;animation-delay:4s;"></div>
<div class="particle" style="left:31%;animation-duration:15s;animation-delay:1s;"></div>
<div class="particle" style="left:42%;animation-duration:12s;animation-delay:3s;"></div>
<div class="particle" style="left:54%;animation-duration:16s;animation-delay:5s;"></div>
<div class="particle" style="left:66%;animation-duration:11s;animation-delay:2s;"></div>
<div class="particle" style="left:77%;animation-duration:14s;animation-delay:4s;"></div>
<div class="particle" style="left:88%;animation-duration:10s;animation-delay:1s;"></div>
<div class="particle" style="left:96%;animation-duration:15s;animation-delay:6s;"></div>


<!-- MAIN CARD -->

<div class="card">

    <div class="logo-area">

        <div class="logo-ring"></div>

        <div class="logo">
            <span class="p">P</span>
        </div>

    </div>


    <h1 class="title">
        PulseHub Key
    </h1>

    <p class="subtitle">
        Your access key is ready to use
    </p>


    <!-- KEY -->

    <div class="key-box">

        <span class="key-label">
            ACCESS KEY
        </span>

        <span
            class="key"
            id="key"
        >PulseHubKeyVskwkej - Nskskwowowoplaowi</span>

    </div>


    <!-- COPY -->

    <button
        class="copy-btn"
        id="copyBtn"
        onclick="copyKey()"
    >
        Copy Key
    </button>


    <div
        class="status"
        id="status"
    ></div>


    <div class="footer">
        PULSEHUB • KEY SYSTEM
    </div>

</div>


<script>

function copyKey(){

    const key =
        document
        .getElementById("key")
        .innerText
        .trim();

    const button =
        document.getElementById("copyBtn");

    const status =
        document.getElementById("status");


    navigator.clipboard
    .writeText(key)
    .then(()=>{

        button.innerHTML =
            "Copied ✓";

        status.innerHTML =
            "Key copied successfully";

        status.style.color =
            "#35dcff";


        setTimeout(()=>{

            button.innerHTML =
                "Copy Key";

            status.innerHTML =
                "";

        },2200);

    })
    .catch(()=>{

        status.innerHTML =
            "Copy failed. Please try again.";

        status.style.color =
            "#ff6375";

    });

}

</script>

</body>
</html>
